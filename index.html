<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ドパガキ専用サイト</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-size: clamp(36px, 8vw, 60px);
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #fb7185, #fbbf24, #a3e635, #22d3ee, #a78bfa, #fb7185);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    margin-top: 12px;
    color: #a3a3a3;
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 576px;
  }
  .key {
    position: relative;
    aspect-ratio: 1;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 75ms ease-out, box-shadow 75ms ease-out, background-color 75ms ease-out;
  }
  .key:hover { filter: brightness(1.1); }
  .key .sheen {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(to bottom, rgba(255,255,255,.35), rgba(255,255,255,.05) 45%, transparent);
    pointer-events: none;
  }
  footer {
    margin-top: auto;
    text-align: center;
    padding: 8px 16px 20px;
    color: #737373;
    font-size: 12px;
  }
  #mute {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid #404040;
    background: rgba(23,23,23,.85);
    color: #e5e5e5;
    font-size: 18px;
    cursor: pointer;
  }
  #mute:hover { background: #262626; }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="ミュートにする">🔊</button>
<main>
  <header>
    <h1>ドパガキ専用サイト</h1>
    <p class="subtitle">四角を押すと青軸キーボードの「カチッ」が鳴ります（6×7＝42個・戻り時にも軽く鳴ります）</p>
  </header>
  <section class="grid" id="grid" aria-label="カラフルな四角が6×7に並んだグリッド"></section>
</main>
<footer>青軸（Cherry MX Blue）の打鍵音を Web Audio API でリアルタイム合成 ♪</footer>

<script>
(() => {
  const COLS = 6, ROWS = 7, TOTAL = COLS * ROWS;
  const grid = document.getElementById('grid');
  const muteBtn = document.getElementById('mute');
  let muted = false;

  // ===== 青軸（Cherry MX Blue）打鍵音を Web Audio API で合成するエンジン =====
  class BlueSwitchAudio {
    constructor() {
      this.ctx = null;
      this.noise = null;
      this.master = null;
    }
    ensure() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        const ctx = new AC();

        // マスターチェーン: 音量 → 高域のシャリッと感 → コンプレッサー（連打時のクリップ防止）
        const master = ctx.createGain();
        master.gain.value = 0.8;
        const shelf = ctx.createBiquadFilter();
        shelf.type = 'highshelf';
        shelf.frequency.value = 3800;
        shelf.gain.value = 2.5;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.knee.value = 12;
        comp.ratio.value = 4;
        comp.attack.value = 0.002;
        comp.release.value = 0.08;
        master.connect(shelf);
        shelf.connect(comp);
        comp.connect(ctx.destination);

        // 共通のホワイトノイズバッファ
        const len = Math.floor(ctx.sampleRate * 0.2);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let j = 0; j < len; j++) data[j] = Math.random() * 2 - 1;

        this.ctx = ctx;
        this.master = master;
        this.noise = buf;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return true;
    }
    // フィルター付きノイズバースト（クリック音・底突き音の素体）
    burst(t, freq, q, gain, decay, type, delay = 0) {
      const ctx = this.ctx;
      const src = ctx.createBufferSource();
      src.buffer = this.noise;
      src.playbackRate.value = 0.9 + Math.random() * 0.2;
      const filter = ctx.createBiquadFilter();
      filter.type = type;
      filter.frequency.value = freq;
      filter.Q.value = q;
      const g = ctx.createGain();
      const t0 = t + delay;
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + decay);
      src.connect(filter);
      filter.connect(g);
      g.connect(this.master);
      src.start(t0);
      src.stop(t0 + decay + 0.03);
    }
    // 減衰の速い正弦波（金属パーツの「チン」という鳴り）
    ping(t, freq, gain, decay, delay = 0) {
      const ctx = this.ctx;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = ctx.createGain();
      const t0 = t + delay;
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + decay);
      osc.connect(g);
      g.connect(this.master);
      osc.start(t0);
      osc.stop(t0 + decay + 0.03);
    }
    // 押し込み時の音
    playDown(pitch = 1) {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime + 0.001;
      const p = pitch * (0.97 + Math.random() * 0.06);
      this.burst(t, 3100 * p, 1.4, 0.5, 0.022, 'bandpass');        // メインの「カチッ」
      this.burst(t, 6200 * p, 2.0, 0.18, 0.01, 'bandpass');        // 金属的な高域ヒット
      this.ping(t, 4400 * p, 0.1, 0.01);                           // 金属鳴り
      this.burst(t, 700 * p, 0.8, 0.28, 0.06, 'lowpass', 0.005);   // 底突きの「トッック」
      this.ping(t, 7200 * p, 0.035, 0.045, 0.004);                 // バネのピン鳴り
    }
    // 戻り（リリース）時の音。青軸は戻るときにも軽く鳴る
    playUp(pitch = 1) {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime + 0.001;
      const p = pitch * (0.97 + Math.random() * 0.06);
      this.burst(t, 3400 * p, 1.6, 0.22, 0.016, 'bandpass');
      this.burst(t, 900 * p, 0.9, 0.1, 0.03, 'lowpass', 0.002);
      this.ping(t, 5600 * p, 0.03, 0.02);
    }
  }

  const audio = new BlueSwitchAudio();
  const pressed = new Set();

  // 42個の四角（虹色を均等分割）＋固定ピッチ差で個体感を演出
  const keys = [];
  for (let i = 0; i < TOTAL; i++) {
    const hue = Math.round((i * 360) / TOTAL);
    const face = `hsl(${hue}, 86%, 58%)`;
    const edge = `hsl(${hue}, 72%, 30%)`;
    const pitch = 0.94 + (((i * 2654435761) % 1000) / 1000) * 0.12;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'key';
    btn.setAttribute('aria-label', `カラフルな四角 ${i + 1}`);
    btn.style.backgroundColor = face;
    btn.style.boxShadow = `0 5px 0 0 ${edge}, 0 10px 20px rgba(0,0,0,.45)`;
    const sheen = document.createElement('span');
    sheen.className = 'sheen';
    btn.appendChild(sheen);

    const press = () => {
      if (pressed.has(i)) return;
      pressed.add(i);
      btn.style.backgroundColor = edge;
      btn.style.transform = 'translateY(5px) scale(0.97)';
      btn.style.boxShadow = '0 0 0 0 ' + edge + ', 0 2px 6px rgba(0,0,0,.6)';
      if (!muted) audio.playDown(pitch);
    };
    const release = (silent = false) => {
      if (!pressed.has(i)) return;
      pressed.delete(i);
      btn.style.backgroundColor = face;
      btn.style.transform = '';
      btn.style.boxShadow = `0 5px 0 0 ${edge}, 0 10px 20px rgba(0,0,0,.45)`;
      if (!silent && !muted) audio.playUp(pitch);
    };

    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
    btn.addEventListener('pointerup', () => release());
    btn.addEventListener('pointerleave', () => release());
    btn.addEventListener('pointercancel', () => release(true));
    btn.addEventListener('keydown', (e) => {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); }
    });
    btn.addEventListener('keyup', (e) => {
      if (e.key === ' ' || e.key === 'Enter') release();
    });
    btn.addEventListener('blur', () => release(true));

    grid.appendChild(btn);
    keys.push(btn);
  }

  // ミュート切替
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? '音をオンにする' : 'ミュートにする');
  });
})();
</script>
</body>
</html>
